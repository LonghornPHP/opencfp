# Installed as /etc/nginx/conf.d/default.conf, which the stock nginx.conf
# includes from inside its http {} block. Only server-level directives belong
# here.
#
# Deliberate omission: there is no fastcgi_pass and no .php handler anywhere in
# this config. This image ships no PHP runtime, so the application can neither
# be served nor executed while this image is deployed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    default_type text/html;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header Cache-Control "no-store" always;
    add_header Retry-After 86400 always;
    add_header X-Maintenance "php-disabled" always;

    # Every request - including /, /index.html and any stray .php path - is a 503.
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
    }

    location / {
        return 503;
    }
}
