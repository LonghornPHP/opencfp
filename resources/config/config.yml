imports:
  - { resource: services/*.yml }

framework:
  # We currently do not depend on this setting, yet it has to be present.
  secret: opencfp
  form: ~
  csrf_protection: ~
  session:
    handler_id: session.handler.native_file
  router:
    resource: '%kernel.project_dir%/resources/config/routing.yml'

wouterj_eloquent:
  driver:   mysql
  host:     '%database.host%'
  database: '%database.database%'
  username: '%database.user%'
  password: '%database.password%'
  charset:   utf8mb4
  collation: utf8mb4_unicode_ci
  prefix:    ~
  eloquent: true

twig:
  default_path: '%kernel.project_dir%/resources/views'
  debug: '%kernel.debug%'
  # Templates use lenient variable access (e.g. {% if email %}); Symfony 6
  # defaults strict_variables to %kernel.debug%, which would break them in tests.
  strict_variables: false
  globals:
    site:       '%config.application%'
    talkHelper: '@OpenCFP\Http\View\TalkHelper'

doctrine_migrations:
  migrations_paths:
    'OpenCFP\Migrations': '%kernel.project_dir%/migrations'
  storage:
    table_storage:
      table_name: migration_versions
      version_column_name: version
      version_column_length: 1024
      executed_at_column_name: executed_at
  all_or_nothing: true
  check_database_platform: true

monolog:
  handlers:
    opencfp:
      type: stream
      path: '%kernel.logs_dir%/app.log'
      level: '%log.level%'
