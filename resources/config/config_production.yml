imports:
  - { resource: config.yml }

framework:
  mailer:
    dsn: '%mail.dsn%'

monolog:
  handlers:
    opencfp:
      type: stream
      path: 'php://stderr'
      level: '%log.level%'

oneup_flysystem:
  adapters:
    uploads:
      local:
        location: "%kernel.project_dir%/web/uploads"

  filesystems:
    uploads:
      adapter: uploads
      alias: upload_filesystem

doctrine:
  dbal:
    url: mysql://%database.user%:%database.password%@%database.host%/%database.database%
    default_table_options:
      charset: utf8mb4
      collate: utf8mb4_unicode_ci
  orm:
    auto_mapping: true
    auto_generate_proxy_classes: true
    mappings:
      OpenCFP\Domain\Entity:
        type: annotation
        dir: "%kernel.project_dir%/src/Domain/Entity"
        prefix: OpenCFP\Domain\Entity

