name: Vultr Deploy
on:
  push:
    branches: [conf-specific]
  workflow_dispatch:

concurrency:
  group: vultr-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'web/**'
              - 'resources/**'
              - 'migrations/**'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'webpack.mix.js'
              - '.docker/**'
              - '.github/workflows/vultr.yml'
            config:
              - '.github/config/opencfp-config.yml'

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ewr.vultrcr.com
          username: ${{ vars.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Takedown: the production service runs .docker/Dockerfile.maintenance, a
      # plain nginx image with a static 503 page and no PHP runtime. The PHP 7
      # application image is intentionally not built or deployed here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.maintenance
          push: true
          tags: |
            ewr.vultrcr.com/longhornphp/cfp:latest
            ewr.vultrcr.com/longhornphp/cfp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Assert image ships no PHP runtime
        run: |
          set -euo pipefail
          IMAGE=ewr.vultrcr.com/longhornphp/cfp:${GITHUB_SHA}
          docker pull "$IMAGE"
          # Fails (exit 1) if any PHP binary is present in the image.
          if docker run --rm --entrypoint sh "$IMAGE" -c \
            'for b in php php-fpm php7 php8; do command -v "$b" && exit 1; done; exit 0'; then
            echo "OK: no PHP runtime present in ${IMAGE}"
          else
            echo "::error::${IMAGE} still contains a PHP runtime; refusing to deploy."
            exit 1
          fi
        shell: bash

  config:
    name: Sync rendered config to host
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.config == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Render production config (substitute secrets)
        run: |
          cp .github/config/opencfp-config.yml opencfp-production.yml
          sed -i 's|ENV_DB_PASSWORD|${{ secrets.OPENCFP_DB_PASSWORD }}|g' opencfp-production.yml
          sed -i 's|ENV_SMTP_USERNAME|${{ vars.OPENCFP_SMTP_USERNAME }}|g' opencfp-production.yml
          sed -i 's|ENV_SMTP_PASSWORD|${{ secrets.OPENCFP_SMTP_PASSWORD }}|g' opencfp-production.yml
          sed -i 's|ENV_OPEN_CFP_CENTRAL_CLIENT_ID|${{ vars.OPENCFP_CENTRAL_CLIENT_ID }}|g' opencfp-production.yml
          sed -i 's|ENV_OPEN_CFP_CENTRAL_CLIENT_SECRET|${{ secrets.OPENCFP_CENTRAL_CLIENT_SECRET }}|g' opencfp-production.yml
        shell: bash

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VULTR_HOST }} > ~/.ssh/known_hosts
        shell: bash

      - name: SCP rendered config to host
        run: |
          scp -i ~/.ssh/id_ed25519 opencfp-production.yml \
            linuxuser@"${{ secrets.VULTR_HOST }}":~/opencfp-production.yml
        shell: bash

  deploy:
    name: Deploy takedown, verify offline
    runs-on: ubuntu-latest
    needs: [changes, build, config]
    if: |
      always() && !cancelled() && !failure() && (
        needs.build.result == 'success' || needs.config.result == 'success'
      )
    steps:
      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.VULTR_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VULTR_HOST }} > ~/.ssh/known_hosts
        shell: bash

      # No migration step: the takedown image has no PHP binary, and the
      # application is not meant to touch the database while it is offline.
      - name: Roll service & wait for convergence
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_RAN: ${{ needs.build.result == 'success' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 linuxuser@"${{ secrets.VULTR_HOST }}" bash -s -- "${GIT_SHA}" "${BUILD_RAN}" <<'ENDSSH'
            set -euo pipefail
            GIT_SHA="$1"
            BUILD_RAN="$2"
            IMAGE="ewr.vultrcr.com/longhornphp/cfp:${GIT_SHA}"

            if [ "$BUILD_RAN" = "true" ]; then
              echo "==> Rolling service to takedown image ${IMAGE}"
              # --no-healthcheck: the service-level probe is defined on the host,
              # outside this repo, and expects an HTTP 200 from the application.
              # The takedown container answers 503 by design, so that probe must
              # not gate this update. Liveness is checked via `docker service ps`.
              # --update-failure-action pause: never roll back. A rollback would
              # restore the previous PHP 7 image and re-expose the vulnerability.
              docker service update \
                --image "$IMAGE" \
                --with-registry-auth \
                --no-healthcheck \
                --update-failure-action pause \
                longhornphp_opencfp
            else
              echo "==> Config-only deploy: asserting the deployed image ships no PHP"
              CURRENT=$(docker service inspect \
                --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' longhornphp_opencfp)
              if ! docker run --rm --entrypoint sh "$CURRENT" -c \
                'for b in php php-fpm php7 php8; do command -v "$b" && exit 1; done; exit 0'; then
                echo "::error::${CURRENT} provides a PHP runtime; refusing to recreate tasks."
                echo "::error::Push an app change so the takedown image is built and deployed."
                exit 1
              fi
              echo "==> Config-only deploy: forcing task recreation to pick up new mounted config"
              docker service update --force longhornphp_opencfp
            fi

            echo "==> Polling Swarm UpdateStatus"
            TIMEOUT=300
            ELAPSED=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              STATE=$(docker service inspect --format '{{.UpdateStatus.State}}' longhornphp_opencfp)
              echo "==> UpdateStatus.State=${STATE} (elapsed ${ELAPSED}s)"
              case "$STATE" in
                completed) break ;;
                rollback_completed)
                  echo "::error::Deploy rolled back to the previous image. Investigate immediately."
                  docker service ps longhornphp_opencfp --no-trunc
                  exit 1 ;;
                paused)
                  echo "::error::Deploy paused (manual intervention required)."
                  exit 1 ;;
              esac
              sleep 5
              ELAPSED=$((ELAPSED+5))
            done
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "::error::convergence timeout after ${TIMEOUT}s"
              docker service ps longhornphp_opencfp --no-trunc
              exit 1
            fi

            if [ "$BUILD_RAN" = "true" ]; then
              echo "==> Verifying running tasks are on ${IMAGE}"
              RUNNING=$(docker service ps longhornphp_opencfp \
                --filter 'desired-state=running' --format '{{.Image}}' | sort -u)
              if ! echo "$RUNNING" | grep -qx "$IMAGE"; then
                echo "::error::tasks not on expected SHA. Running: $RUNNING"
                exit 1
              fi
            fi
            echo "==> Deploy complete"
          ENDSSH
        shell: bash

      - name: Verify site is offline
        run: |
          set -euo pipefail
          URL=https://cfp.longhornphp.com/
          STATUS=000
          for attempt in $(seq 1 12); do
            STATUS=$(curl --location --silent --show-error --max-time 30 \
              --output /tmp/maintenance-body --write-out '%{http_code}' "$URL" || echo 000)
            echo "attempt ${attempt}: HTTP ${STATUS}"
            if [ "$STATUS" = "503" ] && grep -q 'OpenCFP is offline' /tmp/maintenance-body; then
              echo "OK: site is offline and serving the static maintenance page."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Expected HTTP 503 with the maintenance page from ${URL}; last status ${STATUS}"
          head -c 500 /tmp/maintenance-body || true
          exit 1
        shell: bash
